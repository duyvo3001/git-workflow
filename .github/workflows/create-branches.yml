name: Create Git Workflow Branches

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  create-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create git workflow branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the SHA of the default branch (main)
          BASE_SHA=$(git rev-parse HEAD)

          create_branch() {
            local BRANCH=$1
            # Check if branch already exists on remote
            if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
              echo "Branch '$BRANCH' already exists. Skipping."
            else
              git checkout -b "$BRANCH"
              git checkout -
              git push origin "$BRANCH"
              echo "Branch '$BRANCH' created successfully."
            fi
          }

          create_branch "develop"
          create_branch "feature"
          create_branch "bugfix"
          create_branch "release"
          create_branch "uat"
          create_branch "hotfix"
          create_branch "production"

      - name: Set up branch protection rules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          API="https://api.github.com/repos/$REPO/branches"

          protect_branch() {
            local BRANCH=$1
            local REQUIRE_PR=$2
            local REQUIRED_APPROVALS=$3
            local DISMISS_REVIEWS=$4
            local ENFORCE_ADMINS=$5

            echo "Setting protection for branch: $BRANCH"

            curl -s -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$REPO/branches/$BRANCH/protection" \
              -d "{
                \"required_status_checks\": null,
                \"enforce_admins\": $ENFORCE_ADMINS,
                \"required_pull_request_reviews\": $(if [ \"$REQUIRE_PR\" = \"true\" ]; then echo \"{\\\"dismiss_stale_reviews\\\": $DISMISS_REVIEWS, \\\"require_code_owner_reviews\\\": false, \\\"required_approving_review_count\\\": $REQUIRED_APPROVALS}\"; else echo \"null\"; fi),
                \"restrictions\": null
              }" | jq -r '.message // "Protection applied successfully"'
          }

          # production: CI/CD only (no direct push) - require PR + 2 approvals, enforce admins
          protect_branch "production" "true" "2" "true" "true"

          # develop: All developers via PR - require PR + 1 approval
          protect_branch "develop" "true" "1" "false" "false"

          # release: Tech lead - require PR + 1 approval
          protect_branch "release" "true" "1" "true" "false"

          # uat: QA team & Product Owner - require PR + 1 approval
          protect_branch "uat" "true" "1" "false" "false"
